<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>So...Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      color: #b0003a;
      margin-bottom: 40px;
    }
    .hint {
      position: fixed;
      bottom: 20px;
      font-size: 1.8rem;
      color: #7a0030;
      opacity: 0.8;
}
    .buttons {
      position: relative;
      width: 100%;
      height: 300px;
    }
    

    button {
      position: absolute;
      padding: 16px 34px;
      font-size: 1.2rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .photos {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }


.photos img {
width: 220px;
height: 220px;
object-fit: cover;
border-radius: 20px;
box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.photo1 { top: 10%; left: 20%; transform: rotate(-8deg); }
.photo2 { top: 35%; left: 45%; transform: rotate(6deg); }
.photo3 { top: 15%; left: 65%; transform: rotate(-3deg); }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      left: 45%;
      top: 120px;
      transform: scale(1);
    }

    #noBtn {
      background-color: #555;
      color: white;
      position: fixed; /* IMPORTANT: use viewport coordinates */
      left: 55%;
      top: 120px;
      transition: left 0.25s ease, top 0.25s ease;
    }
  </style>
</head>
<body>
  <h1>So...Will you be my Valentine? ❤️</h1>

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
  <p class="hint">("No" is a little shy. You can try though🤷‍♂️)</p>
  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    let yesScale = 1;

    // YES button grows each time NO is approached
    function growYes() {
      yesScale += 0.01;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;

      const dx = btnCenterX - e.clientX;
      const dy = btnCenterY - e.clientY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      const safeDistance = 300; // distance to keep from mouse
      const maxStep = 250; // max movement per frame

      if (distance < safeDistance) {
        growYes();

        // Push button away so it maintains safeDistance
        const overlap = safeDistance - distance;
        const angle = Math.atan2(dy, dx);
        const moveDistance = Math.min(maxStep, overlap);

        let newLeft = rect.left + Math.cos(angle) * moveDistance;
        let newTop = rect.top + Math.sin(angle) * moveDistance;

        // Keep NO button inside viewport
        newLeft = Math.max(0, Math.min(window.innerWidth - rect.width, newLeft));
        newTop = Math.max(0, Math.min(window.innerHeight - rect.height, newTop));

        noBtn.style.left = `${newLeft}px`;
        noBtn.style.top = `${newTop}px`;
      }
    });

    // Clicking YES
    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <h1 style="color:#b0003a; text-align:center;">Yayyyy I am loved!!</h1>

        <p style="font-size:2rem;">I LOVE YOU😘❤️</p>
        <div class="photos">
            <img class="photo1" src="ImageOne.png" alt="Memory 1" />
            <img class="photo2" src="ImageTwo.JPG" alt="Memory 2" />
            <img class="photo3" src="ImageThree.png" alt="Memory 3" />
        </div>

      `;
    });
  </script>
</body>
</html>
